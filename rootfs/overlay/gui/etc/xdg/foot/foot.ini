# R36Ultra (720x720). Replaces the example that comes with foot.
[main]
# The panel carries no EDID through simpledrm, so no usable physical size:
# keep the font size fixed rather than derived from DPI.
dpi-aware=no

# Terminus is a bitmap font: no antialiasing to blur it at this resolution, and
# a narrow 8x16 cell (90x45 characters here). Swap the comment to compare.
font=Terminus:pixelsize=16
#font=JetBrains Mono:size=11
#font=DejaVu Sans Mono:size=11

pad=2x2
